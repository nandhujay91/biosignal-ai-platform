name: Biosignal CI Pipeline


on:

  push:
    branches:
      - main

  pull_request:
    branches:
      - main



jobs:


  test:

    name: Run Tests

    runs-on: ubuntu-latest

    steps:


      - name: Checkout repository
        uses: actions/checkout@v4



      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"



      - name: Install uv
        run: |
          pip install uv



      - name: Install dependencies
        run: |
          uv sync



      - name: Create synthetic test data
        env:
          PYTHONPATH: .
        run: |
          uv run python tests/create_test_data.py



      - name: Create synthetic model artifacts
        env:
          PYTHONPATH: .
        run: |
          uv run python tests/create_test_artifacts.py



      - name: Run pytest
        env:
          PYTHONPATH: .
        run: |
          uv run pytest





  quality:

    name: Code Quality Checks

    runs-on: ubuntu-latest


    steps:


      - name: Checkout repository
        uses: actions/checkout@v4



      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"



      - name: Install uv
        run: |
          pip install uv



      - name: Install dependencies
        run: |
          uv sync



      - name: Ruff check
        run: |
          uv run ruff check src tests scripts



      - name: Black check
        run: |
          uv run black --check src tests scripts



      - name: MyPy check
        run: |
          uv run mypy src scripts